name: Build Flutter Release APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android platform scaffolding exists
        run: |
          if [ ! -d "android" ]; then
            echo "Preserving project source and configuration..."
            cp -r lib lib_backup
            cp pubspec.yaml pubspec_backup.yaml

            echo "Generating Android platform scaffolding..."
            flutter create . --platforms=android --org com.uninotes

            echo "Restoring project source and configuration..."
            rm -rf lib
            mv lib_backup lib
            cp pubspec_backup.yaml pubspec.yaml
          fi

      - name: Configure Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              echo "Injecting microphone and audio recording permissions..."
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
          fi

      - name: Configure Android SDK
        run: |
          echo "Updating compileSdk and targetSdk to 36 in app build.gradle.kts..."
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
          fi

          if [ -f "android/gradle.properties" ]; then
            echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
